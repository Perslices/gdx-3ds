name: Release (3DS, native renderer)

# Builds everything a player needs without a compiler:
#   * gdx-extract, the PC-side asset extractor tools/prebake drives, for Windows, macOS and Linux;
#   * all four console targets -- Old 3DS, New 3DS, and their Expansion Kit titles -- as
#     .3dsx/.cia/.elf from a clean checkout via tools/ci-3ds.sh plus the matching cmake flags,
#     each also packaged as a ready-to-drop-on-an-SD-card zip.
#
# Runs on every push and pull request against `native` (artifacts only, nothing attached, so a
# PR shows green/red per console target) and on a `native-v*` tag or a manual dispatch naming an
# existing release tag (builds AND attaches/updates the release). `workflow_dispatch` also takes
# an optional `targets` input to build only some of the four, for a quick one-off.
#
# This is the `native` branch's workflow. What differs from the `main` one:
#   * tags are `native-v*`, so a native beta never collides with a stable `v*` release;
#   * submodules are initialised BY NAME. The 3DS lane needs `decomp` and `torch` (for
#     libmio0) -- the slice of libultraship the console compiles is vendored in-tree at
#     port/3ds/vendor/lus/ (see its PROVENANCE.md), so the `libultraship` submodule is
#     desktop-only and is never fetched here. `torch` is the extractor's source and is
#     fetched only by the extractor job. The one-liner for a human clone that wants both
#     lanes is:
#         git submodule update --init decomp torch
#   * Ninja + ccache are installed in the container, so tools/ci-3ds.sh picks them up and
#     the incremental rebuild it times is meaningful; the ccache directory is cached
#     between runs, one cache per console target;
#   * tools/ci-3ds.sh is the single correctness gate, run once per console target: it checks
#     the vendored-LUS MANIFEST.sha256, applies the 52-patch decomp stack idempotently
#     (failing loudly on an unknown patch file), builds and runs the full host-test suite,
#     then builds the shipped (New 3DS, non-EK) .3dsx. The other three targets configure a
#     second, target-specific build directory with the matching -DGDX_3DS_O3DS /
#     -DGDX_3DS_EXPANSION_KIT flags against the same already-patched `decomp/` checkout;
#   * makerom and bannertool are built from source once, inside the same devkitARM container
#     image the console jobs run in (the prebuilt Linux binaries need a newer glibc than that
#     image has, and a binary built on a *different* image is not guaranteed to match), then
#     handed to the four console jobs as a build artifact instead of each job rebuilding them.

on:
  push:
    branches: ['native']
    tags: ['native-v*']
  pull_request:
    branches: ['native']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the artifacts to (blank = artifacts only)'
        required: false
        default: ''
      targets:
        description: 'Which console targets to build: "all" or a comma/space list of o3ds, n3ds, o3ds-ek, n3ds-ek'
        required: false
        default: 'all'

permissions:
  contents: write

jobs:
  extractor:
    name: gdx-extract (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, name: windows-x64,   exe: gdx-extract.exe }
          - { os: macos-14,     name: macos-universal, exe: gdx-extract, extra: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0' }
          - { os: ubuntu-22.04, name: linux-x64,     exe: gdx-extract }
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the Torch submodule only
        run: git submodule update --init --depth 1 torch
      - name: Configure
        run: >
          cmake -S torch -B build-extract
          -DUSE_STANDALONE=ON -DBUILD_STORMLIB=OFF -DGDX_DETERMINISTIC=ON
          -DGDX_OUTPUT_NAME=gdx-extract -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_POLICY_DEFAULT_CMP0091=NEW ${{ matrix.extra }}
      - name: Build
        run: cmake --build build-extract --config Release --parallel 4
      - name: Install
        run: cmake --install build-extract --config Release --prefix build-extract/install
      - name: Package
        shell: bash
        run: |
          set -e
          mkdir -p pkg
          cp "build-extract/install/bin/${{ matrix.exe }}" pkg/
          if command -v lipo >/dev/null; then lipo -info "pkg/${{ matrix.exe }}"; fi
          cat > pkg/README.txt <<'TXT'
          gdx-extract: the PC-side asset extractor for the G-Diffuser 3DS port.
          Use it with tools/prebake/prebake.py from the repository:
            python3 tools/prebake/prebake.py --rom <your F-Zero X US rev0 .z64> --extractor <path to this binary>
          It reads your own cartridge dump and writes fzerox.o2r / gdiffuser.o2r under dist/sdmc/.
          No game data is included here.
          TXT
          cd pkg && (command -v zip >/dev/null && zip -q -r "../gdx-extract-${{ matrix.name }}.zip" . || 7z a -bd "../gdx-extract-${{ matrix.name }}.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: gdx-extract-${{ matrix.name }}
          path: gdx-extract-${{ matrix.name }}.zip
          if-no-files-found: error

  setup:
    name: Plan the console build
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      attach: ${{ steps.plan.outputs.attach }}
    steps:
      - name: Work out the target matrix, the version string, and whether to attach to a release
        id: plan
        shell: bash
        env:
          INPUT_TARGETS: ${{ github.event.inputs.targets }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -e
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re

          all_targets = [
              {"name": "o3ds",    "suffix": "O3DS",    "cmake_flags": "-DGDX_3DS_O3DS=ON"},
              {"name": "n3ds",    "suffix": "N3DS",    "cmake_flags": ""},
              {"name": "o3ds-ek", "suffix": "O3DS-EK", "cmake_flags": "-DGDX_3DS_O3DS=ON -DGDX_3DS_EXPANSION_KIT=ON"},
              {"name": "n3ds-ek", "suffix": "N3DS-EK", "cmake_flags": "-DGDX_3DS_EXPANSION_KIT=ON"},
          ]
          by_name = {t["name"]: t for t in all_targets}

          requested = os.environ.get("INPUT_TARGETS", "all").strip()
          if not requested or requested.lower() == "all":
              chosen = all_targets
          else:
              names = [n.strip().lower() for n in re.split(r"[,\s]+", requested) if n.strip()]
              unknown = [n for n in names if n not in by_name]
              if unknown:
                  raise SystemExit(
                      f"workflow_dispatch targets: unknown target(s) {unknown}; "
                      f"choose from {sorted(by_name)} or 'all'"
                  )
              chosen = [by_name[n] for n in names] or all_targets

          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          ref_type = os.environ.get("GITHUB_REF_TYPE", "")
          dispatch_tag = os.environ.get("INPUT_TAG", "").strip()
          sha_short = os.environ.get("GITHUB_SHA", "")[:7]

          if ref_type == "tag" and ref_name.startswith("native-v"):
              version = ref_name[len("native-v"):]
              tag = ref_name
          elif dispatch_tag:
              version = dispatch_tag[len("native-v"):] if dispatch_tag.startswith("native-v") else dispatch_tag
              tag = dispatch_tag
          else:
              version = f"dev-{sha_short}"
              tag = ""

          print(f"matrix={json.dumps({'target': chosen})}")
          print(f"version={version}")
          print(f"tag={tag}")
          print(f"attach={'true' if tag else 'false'}")
          PY

  toolchain:
    name: makerom + bannertool
    needs: [setup]
    runs-on: ubuntu-22.04
    container: devkitpro/devkitarm:latest
    steps:
      - name: Host packages
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            git cmake build-essential curl ca-certificates >/dev/null
      - name: Cache the from-source build
        id: cache
        uses: actions/cache@v4
        with:
          path: tools-3ds-bin
          key: makerom-v0.19.0-bannertool-1.2.3-devkitarm-${{ hashFiles('.github/workflows/release-3ds.yml') }}
      - name: Build makerom + bannertool from source (prebuilt binaries need a newer glibc than this image)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          mkdir -p tools-3ds-bin
          git clone -q --depth 1 --branch makerom-v0.19.0 https://github.com/3DSGuy/Project_CTR.git /tmp/ctr
          make -s -C /tmp/ctr/makerom deps >/dev/null && make -s -C /tmp/ctr/makerom -j4 >/dev/null
          cp /tmp/ctr/makerom/bin/makerom tools-3ds-bin/
          curl -sSL -o /tmp/bt.tar.gz https://github.com/carstene1ns/3ds-bannertool/releases/download/1.2.3/bannertool-1.2.3.tar.gz
          mkdir -p /tmp/bt && tar xzf /tmp/bt.tar.gz -C /tmp/bt --strip-components=1
          cmake -S /tmp/bt -B /tmp/bt/build -DCMAKE_BUILD_TYPE=Release >/dev/null && cmake --build /tmp/bt/build --parallel 4 >/dev/null
          cp "$(find /tmp/bt/build -type f -name bannertool | head -1)" tools-3ds-bin/
          chmod +x tools-3ds-bin/makerom tools-3ds-bin/bannertool
      - run: chmod +x tools-3ds-bin/makerom tools-3ds-bin/bannertool && ls -la tools-3ds-bin
      - uses: actions/upload-artifact@v4
        with:
          name: 3ds-bin
          path: tools-3ds-bin/*
          if-no-files-found: error

  console:
    name: 3DS build (${{ matrix.target.suffix }})
    needs: [setup, toolchain]
    runs-on: ubuntu-22.04
    container: devkitpro/devkitarm:latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    env:
      DEVKITPRO: /opt/devkitpro
      CCACHE_DIR: /ccache
      CCACHE_MAXSIZE: 500M
      GDX_VER: ${{ needs.setup.outputs.version }}
    steps:
      - name: Host packages
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            git cmake build-essential ninja-build ccache zip \
            python3 python3-yaml python3-pil curl ca-certificates >/dev/null
          git config --global --add safe.directory '*'
          cmake --version | head -1
          ninja --version
          ccache --version | head -1

      # No `submodules:` here on purpose — the 3DS lane initialises by name below.
      - uses: actions/checkout@v4

      - name: Submodules (3DS lane only — libultraship is vendored in-tree)
        run: |
          set -e
          git submodule update --init --depth 1 decomp torch
          test -f decomp/Makefile
          test -f port/3ds/vendor/lus/cmake/cvars.cmake
          echo "libultraship submodule intentionally NOT initialised:"
          git submodule status | sed 's/^/  /'

      - name: ccache
        uses: actions/cache@v4
        with:
          path: /ccache
          key: ccache-3ds-native-${{ matrix.target.name }}-${{ github.sha }}
          restore-keys: |
            ccache-3ds-native-${{ matrix.target.name }}-

      - name: Fetch makerom + bannertool (built once, shared by all four targets)
        uses: actions/download-artifact@v4
        with:
          name: 3ds-bin
          path: tools/3ds-bin
      - run: chmod +x tools/3ds-bin/makerom tools/3ds-bin/bannertool && ls -la tools/3ds-bin

      # One gate, run once per target against its own checkout: vendored-LUS MANIFEST.sha256 ->
      # the 52 decomp patches (idempotent; an unlisted patch file is a hard FAIL) -> the full
      # host-test suite -> configure + full + incremental 3DS build of the SHIPPED (New 3DS,
      # non-EK) config into build-3ds/. For the n3ds target that build dir already IS the
      # artifact; the other three targets configure a second, flag-specific build dir below,
      # against the same (already-patched) decomp/ checkout.
      - name: Vendored-LUS manifest, decomp patches, host tests, shipped 3DS build (the gate)
        run: tools/ci-3ds.sh --jobs 4

      - name: Configure the target-specific build (o3ds / *-ek only; n3ds reuses the gate's build-3ds)
        if: matrix.target.name != 'n3ds'
        run: |
          set -e
          cmake -S . -B "build-3ds-${{ matrix.target.name }}" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/3DS.cmake" \
            -DGDX_PLATFORM_3DS=ON -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.target.cmake_flags }}

      - name: Build the target-specific .3dsx + .cia (o3ds / *-ek only)
        if: matrix.target.name != 'n3ds'
        run: |
          set -e
          cmake --build "build-3ds-${{ matrix.target.name }}" --target G-Diffuser-3DS --parallel 4
          cmake --build "build-3ds-${{ matrix.target.name }}" --target G-Diffuser-3DS-cia --parallel 4

      - name: .cia for n3ds (same build tree the gate used, no reconfigure)
        if: matrix.target.name == 'n3ds'
        run: cmake --build build-3ds --target G-Diffuser-3DS-cia --parallel 4

      - name: ccache stats
        if: always()
        run: ccache --show-stats | head -20

      - name: Collect, rename, zip
        run: |
          set -e
          SUFFIX="${{ matrix.target.suffix }}"
          NAME="G-Diffuser-3DS-${SUFFIX}"
          if [ "${{ matrix.target.name }}" = "n3ds" ]; then
            BUILD_DIR=build-3ds
          else
            BUILD_DIR="build-3ds-${{ matrix.target.name }}"
          fi
          SRC="${BUILD_DIR}/port/3ds"

          mkdir -p out zippkg/3ds
          cp "${SRC}/G-Diffuser-3DS.3dsx" "out/${NAME}.3dsx"
          cp "${SRC}/G-Diffuser-3DS.cia"  "out/${NAME}.cia"
          cp "${SRC}/G-Diffuser-3DS.elf"  "out/${NAME}.elf"

          CONSOLE_LINE="Old 3DS / Old 2DS"
          case "$SUFFIX" in
            N3DS|N3DS-EK) CONSOLE_LINE="New 3DS / New 2DS XL" ;;
          esac
          EK_LINE=""
          case "$SUFFIX" in
            *-EK)
              EK_LINE=$'\nThis is the Expansion Kit title: it installs alongside the normal game and needs the\n64DD disk image too. Put your own .ndd dump at:\n  3ds/gdiffuser/media/\n'
              ;;
          esac

          cp "out/${NAME}.3dsx" "zippkg/3ds/${NAME}.3dsx"
          cp "out/${NAME}.cia"  "zippkg/${NAME}.cia"
          printf '%s\n' \
            "G-Diffuser 3DS -- ${SUFFIX} build (v${GDX_VER})" \
            "Console: ${CONSOLE_LINE}" \
            "" \
            "Two ways to run it:" \
            "  * Homebrew Launcher: copy 3ds/${NAME}.3dsx to the SD card's /3ds/ folder, then launch it" \
            "    from the Homebrew Launcher." \
            "  * HOME menu: install ${NAME}.cia with your usual CIA installer (needs CFW)." \
            "" \
            "Either way, this .3dsx/.cia is the ENGINE ONLY. It reads your own F-Zero X dump: run" \
            "tools/prebake/prebake.py from the repository (with gdx-extract, built by this same release)" \
            "against your own cartridge/ROM dump, then copy the two files it writes onto the SD card at:" \
            "  3ds/gdiffuser/" \
            "${EK_LINE}" \
            "No game data is included in this download." \
            > "zippkg/README.txt"
          ( cd zippkg && zip -q -r "../out/${NAME}-v${GDX_VER}.zip" README.txt 3ds "${NAME}.cia" )
          rm -rf zippkg

          cd out && sha256sum "${NAME}".3dsx "${NAME}".cia "${NAME}".elf "${NAME}-v${GDX_VER}.zip" > "SHA256SUMS-${SUFFIX}" && cat "SHA256SUMS-${SUFFIX}"

      - name: CI logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-3ds-logs-${{ matrix.target.suffix }}
          path: |
            build-3ds*/ci-*.log
            build-3ds*/host-tests/*.log
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: G-Diffuser-3DS-${{ matrix.target.suffix }}
          path: out/*
          if-no-files-found: error

  combine:
    name: Combine the four targets into one manifest
    needs: [setup, console]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: G-Diffuser-3DS-*
          path: artifacts
          merge-multiple: true
      - name: One SHA256SUMS over every console asset
        run: |
          set -e
          cd artifacts
          rm -f SHA256SUMS-*
          ls -la
          sha256sum *.3dsx *.cia *.elf *.zip > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: G-Diffuser-3DS
          path: artifacts/*
          if-no-files-found: error

  publish:
    name: Attach to release
    needs: [setup, extractor, combine]
    if: needs.setup.outputs.attach == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Which file do I need? (release notes table)
        id: notes
        shell: bash
        env:
          GDX_VER: ${{ needs.setup.outputs.version }}
        run: |
          set -e
          TABLE=$(printf '%s\n' \
            '## Which file do I need?' \
            '' \
            '| Console | File |' \
            '|---|---|' \
            '| Old 3DS / Old 2DS | `G-Diffuser-3DS-O3DS-v<ver>.zip` |' \
            '| New 3DS / New 2DS XL | `G-Diffuser-3DS-N3DS-v<ver>.zip` |' \
            '| Old 3DS / Old 2DS, with the Expansion Kit disk | `G-Diffuser-3DS-O3DS-EK-v<ver>.zip` |' \
            '| New 3DS / New 2DS XL, with the Expansion Kit disk | `G-Diffuser-3DS-N3DS-EK-v<ver>.zip` |' \
            '' \
            'Each zip contains the `.3dsx` (Homebrew Launcher), the `.cia` (HOME menu install) and a' \
            'README on where your own extracted game data goes. The loose `.3dsx`/`.cia`/`.elf`' \
            'files and `SHA256SUMS` below are the same builds, unpacked.')
          TABLE="${TABLE//<ver>/${GDX_VER}}"
          {
            echo "table<<GDXEOF"
            echo "$TABLE"
            echo "GDXEOF"
          } >> "$GITHUB_OUTPUT"
      - name: Ensure the release exists and mentions which file to pick
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
          TABLE: ${{ steps.notes.outputs.table }}
        run: |
          set -e
          if gh release view "$TAG" -R "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            BODY="$(gh release view "$TAG" -R "${GITHUB_REPOSITORY}" --json body --jq .body)"
            if ! grep -qF "Which file do I need?" <<<"$BODY"; then
              printf '%s\n\n%s\n' "$BODY" "$TABLE" | gh release edit "$TAG" -R "${GITHUB_REPOSITORY}" --notes-file -
            fi
          else
            printf '%s\n' "$TABLE" | gh release create "$TAG" -R "${GITHUB_REPOSITORY}" --title "$TAG" --notes-file -
          fi
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          set -e
          ls -R artifacts
          gh release upload "$TAG" artifacts/gdx-extract-*/gdx-extract-*.zip --clobber -R "${GITHUB_REPOSITORY}"
          for f in artifacts/G-Diffuser-3DS/*; do
            name=$(basename "$f")
            if gh release view "$TAG" -R "${GITHUB_REPOSITORY}" --json assets --jq '.assets[].name' | grep -qx "$name"; then
              echo "keep existing $name"
            else
              gh release upload "$TAG" "$f" -R "${GITHUB_REPOSITORY}"
            fi
          done
